<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7400호대 디젤기관차 운행정보 제보</title>
  <style>
    :root {
      --primary-color: #00427c; /* 한국철도 상징 블루 */
      --accent-color: #ffb800;  /* 기관차 포인트 옐로우 */
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      background: var(--primary-color);
      color: white;
      padding: 24px 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .notice {
      background-color: #eef5ff;
      border-left: 4px solid var(--primary-color);
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #002d54;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: #777777;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚂 7400호대 운행정보 제보센터</h1>
      <p>7400호대 디젤기관차의 목격 정보를 공유해 주세요!</p>
    </header>

    <div class="card">
      <div class="notice">
        📌 <strong>안내:</strong> 현재는 목격 제보만 받는 임시 운영 기간입니다. 제보해주신 정보는 데이터 축적 후 운행 현황판 제공 시 활용됩니다.
      </div>

      <!-- Google Forms / Formspree 등과 연결하여 실제 전송 가능 -->
      <form id="reportForm" onsubmit="handleSubmit(event)">
        
        <div class="row">
          <div class="form-group">
            <label for="locoNumber">차량 번호 *</label>
            <input type="number" id="locoNumber" placeholder="예: 7401" min="7401" max="7484" required />
          </div>
          <div class="form-group">
            <label for="trainNumber">열차 번호</label>
            <input type="text" id="trainNumber" placeholder="예: #1201" />
          </div>
        </div>

        <div class="form-group">
          <label for="location">목격 장소 (역 또는 구간) *</label>
          <input type="text" id="location" placeholder="예: 대전역, 의왕~수원 구간" required />
        </div>

        <div class="row">
          <div class="form-group">
            <label for="date">목격 날짜 *</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group">
            <label for="time">목격 시간 *</label>
            <input type="time" id="time" required />
          </div>
        </div>

        <div class="form-group">
          <label for="direction">운행 방향 / 상·하행</label>
          <select id="direction">
            <option value="">선택 안 함</option>
            <option value="상행">상행</option>
            <option value="하행">하행</option>
            <option value="정차/유치">정차 / 유치 중</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notes">특이사항 (도색, 조성, 전달사항 등)</label>
          <textarea id="notes" rows="3" placeholder="예: 고추장 도색, 화물열차 견인 중 등"></textarea>
        </div>

        <button type="submit">제보 제출하기</button>
      </form>
    </div>

    <footer>
      <p>© 7400호대 운행정보 프로젝트. All rights reserved.</p>
    </footer>
  </div>

  <script>
    // 오늘 날짜 및 현재 시간을 기본값으로 설정
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.getElementById('date').value = now.toISOString().substring(0, 10);
      document.getElementById('time').value = now.toTimeString().substring(0, 5);
    });

    function handleSubmit(event) {
      event.preventDefault();
      
      // 제보 데이터 모으기
      const data = {
        locoNumber: document.getElementById('locoNumber').value,
        trainNumber: document.getElementById('trainNumber').value,
        location: document.getElementById('location').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        direction: document.getElementById('direction').value,
        notes: document.getElementById('notes').value
      };

      console.log("제보된 데이터:", data);
      alert(`[7400호대 제보 완료]\n${data.locoNumber}호 제보가 접수되었습니다. 감사합니다!`);

      // 폼 초기화
      document.getElementById('reportForm').reset();
      
      // 날짜/시간 재설정
      const now = new Date();
      document.getElementById('date').value = now.toISOString().substring(0, 10);
      document.getElementById('time').value = now.toTimeString().substring(0, 5);
    }
  </script>
</body>
</html>
